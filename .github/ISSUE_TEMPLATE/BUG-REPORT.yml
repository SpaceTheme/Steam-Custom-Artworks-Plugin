name: Bug Report
description: Create a bug report to help us find and fix bugs!
title: "[Bug] "
type: "Bug"
labels: [bug]
projects: "SpaceTheme/3"
assignees: SpaceEnergy
body:
  - type: markdown
    attributes:
      value: |
        Missing or wrong artwork for a game? That's not a plugin bug, [request or change the artwork](https://github.com/SpaceTheme/Steam-Custom-Artworks/issues/new?template=ARTWORK.yml) instead.
  - type: checkboxes
    attributes:
      label: Step 1. Pre-report Checklist
      description: Please check the following before reporting a bug. This helps us to quickly identify and resolve issues.
      options:
      - label: I checked if there is already an open issue that described my problem.
        required: true
      - label: I checked if there is already an open issue at [Millennium](https://github.com/SteamClientHomebrew/Millennium/issues) that describes my problem.
        required: true
      - label: I use the latest version of the plugin.
        required: true
      - label: I ticked the checkboxes without reading them.
        required: false
  - type: dropdown
    attributes:
      label: Step 2. Operating system
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Step 3. Steam update channel
      description: Steam → Settings → Interface → Client Beta Participation
      options:
        - Stable
        - Beta
    validations:
      required: true
  - type: input
    attributes:
      label: Step 4. Millennium and plugin version
      description: Both are shown in Millennium's settings.
      placeholder: "Millennium 3.6.1, Steam-Custom-Artworks 1.0.0"
    validations:
      required: true
  - type: input
    attributes:
      label: Step 5. Theme
      description: The Steam theme you use, or "none".
      placeholder: "SpaceTheme for Steam"
    validations:
      required: true
  - type: input
    attributes:
      label: Step 6. Status in the plugin settings
      description: The text below **Installed artworks** in the plugin settings, e.g. "Last checked at 17:51" or "Last check failed …".
      placeholder: "Last check failed: …"
  - type: textarea
    attributes:
      label: Step 7. Describe the issue
    validations:
      required: true
  - type: textarea
    attributes:
      label: Step 8. How to reproduce
      placeholder: |
        1. Open the plugin settings
        2. Pick a color and click Apply
        3. See bug...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
